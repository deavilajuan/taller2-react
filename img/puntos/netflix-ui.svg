<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%" style="background:#141414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Header Netflix -->
  <rect width="800" height="50" fill="#000000"/>
  <text x="30" y="35" fill="#e50914" font-size="24" font-weight="900" letter-spacing="1">NETFLIX</text>
  <text x="160" y="32" fill="#e5e5e5" font-size="13">Inicio</text>
  <text x="215" y="32" fill="#aaa" font-size="13">Series</text>
  <text x="275" y="32" fill="#aaa" font-size="13">Películas</text>
  <text x="730" y="32" fill="#e5e5e5" font-size="12">Perfil 👤</text>

  <!-- Banner Hero -->
  <g transform="translate(30, 70)">
    <rect width="740" height="100" rx="8" fill="#221f1f"/>
    <text x="30" y="45" fill="#ffffff" font-size="20" font-weight="bold">Interfaz TV optimizada con componentes React</text>
    <text x="30" y="70" fill="#aaa" font-size="12">Carga instantánea de catálogo en Smart TVs y dispositivos de bajos recursos</text>
    <rect x="580" y="35" width="130" height="35" rx="4" fill="#e50914"/>
    <text x="645" y="57" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">▶ Reproducir</text>
  </g>

  <!-- Fila de carátulas modulares -->
  <text x="30" y="195" fill="#ffffff" font-size="14" font-weight="bold">Tendencias ahora (Componentes &lt;Caratula /&gt;)</text>
  <g transform="translate(30, 205)">
    <rect x="0" width="135" height="80" rx="6" fill="#2d3748"/>
    <text x="67" y="45" text-anchor="middle" fill="#718096" font-size="11">Item 1</text>
    
    <rect x="150" width="135" height="80" rx="6" fill="#2d3748"/>
    <text x="217" y="45" text-anchor="middle" fill="#718096" font-size="11">Item 2</text>
    
    <rect x="300" width="135" height="80" rx="6" fill="#2d3748"/>
    <text x="367" y="45" text-anchor="middle" fill="#718096" font-size="11">Item 3</text>
    
    <rect x="450" width="135" height="80" rx="6" fill="#2d3748"/>
    <text x="517" y="45" text-anchor="middle" fill="#718096" font-size="11">Item 4</text>
    
    <rect x="600" width="135" height="80" rx="6" fill="#2d3748"/>
    <text x="667" y="45" text-anchor="middle" fill="#718096" font-size="11">Item 5</text>
  </g>
</svg>
