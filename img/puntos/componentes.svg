<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <text x="400" y="38" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold">Anatomía de Componentes y Flujo de Props</text>

  <!-- Componente Padre -->
  <g transform="translate(40, 70)">
    <rect width="320" height="220" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="320" height="35" rx="10" fill="#2563eb"/>
    <text x="160" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Componente Padre (&lt;Catalogo /&gt;)</text>
    
    <g transform="translate(15, 55)" fill="#e2e8f0" font-size="12" font-family="monospace">
      <text x="0" y="20" fill="#93c5fd">function Catalogo() {</text>
      <text x="15" y="45" fill="#fef08a">return (</text>
      <text x="30" y="70" fill="#38bdf8">&lt;TarjetaProducto</text>
      <text x="45" y="95" fill="#f472b6">nombre="Zapatos"</text>
      <text x="45" y="115" fill="#f472b6">precio={120}</text>
      <text x="30" y="135" fill="#38bdf8">/&gt;</text>
      <text x="15" y="155" fill="#fef08a">)</text>
      <text x="0" y="175" fill="#93c5fd">}</text>
    </g>
  </g>

  <!-- Flecha Props -->
  <g transform="translate(370, 160)">
    <path d="M 5 0 L 55 0" stroke="#f472b6" stroke-width="3"/>
    <polygon points="55,-5 65,0 55,5" fill="#f472b6"/>
    <text x="35" y="-12" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="bold">Props</text>
    <text x="35" y="25" text-anchor="middle" fill="#94a3b8" font-size="10">(Solo lectura)</text>
  </g>

  <!-- Componente Hijo -->
  <g transform="translate(440, 70)">
    <rect width="320" height="220" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="320" height="35" rx="10" fill="#059669"/>
    <text x="160" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Componente Hijo (&lt;TarjetaProducto /&gt;)</text>

    <g transform="translate(15, 55)" fill="#e2e8f0" font-size="12" font-family="monospace">
      <text x="0" y="20" fill="#86efac">function TarjetaProducto(props) {</text>
      <text x="15" y="45" fill="#fef08a">return (</text>
      <text x="30" y="70" fill="#38bdf8">&lt;div className="card"&gt;</text>
      <text x="45" y="95" fill="#ffffff">&lt;h3&gt;{props.nombre}&lt;/h3&gt;</text>
      <text x="45" y="115" fill="#4ade80">&lt;p&gt;${props.precio}&lt;/p&gt;</text>
      <text x="30" y="135" fill="#38bdf8">&lt;/div&gt;</text>
      <text x="15" y="155" fill="#fef08a">)</text>
      <text x="0" y="175" fill="#86efac">}</text>
    </g>
  </g>
</svg>
