<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Barra de búsqueda superior tipo Airbnb -->
  <g transform="translate(150, 20)">
    <rect width="500" height="50" rx="25" fill="#ffffff" stroke="#dddddd" stroke-width="1.5" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.08))"/>
    <text x="50" y="30" fill="#222222" font-size="13" font-weight="bold">Cualquier lugar</text>
    <text x="175" y="30" fill="#dddddd">|</text>
    <text x="210" y="30" fill="#222222" font-size="13" font-weight="bold">Cualquier semana</text>
    <text x="350" y="30" fill="#dddddd">|</text>
    <text x="380" y="30" fill="#717171" font-size="13">¿Cuántos?</text>
    <circle cx="475" cy="25" r="16" fill="#ff385c"/>
    <text x="475" y="30" text-anchor="middle" fill="#ffffff" font-size="12">🔍</text>
  </g>

  <!-- Tarjetas modulares de casas de Airbnb (Design System) -->
  <text x="40" y="105" fill="#222222" font-size="15" font-weight="bold">Alojamientos populares (Sistema de diseño modular en React)</text>
  
  <g transform="translate(40, 120)">
    <!-- Tarjeta 1 -->
    <rect width="220" height="130" rx="10" fill="#f1f5f9"/>
    <rect width="220" height="90" rx="10" fill="#cbd5e1"/>
    <text x="110" y="50" text-anchor="middle" fill="#64748b" font-size="12">Foto Casa 1</text>
    <text x="10" y="108" fill="#222222" font-size="13" font-weight="bold">Cartagena, Colombia</text>
    <text x="10" y="124" fill="#717171" font-size="11">$85 USD por noche</text>
    <text x="200" y="108" text-anchor="end" fill="#222222" font-size="12">★ 4.95</text>
  </g>

  <g transform="translate(290, 120)">
    <!-- Tarjeta 2 -->
    <rect width="220" height="130" rx="10" fill="#f1f5f9"/>
    <rect width="220" height="90" rx="10" fill="#cbd5e1"/>
    <text x="110" y="50" text-anchor="middle" fill="#64748b" font-size="12">Foto Casa 2</text>
    <text x="10" y="108" fill="#222222" font-size="13" font-weight="bold">Medellín, Colombia</text>
    <text x="10" y="124" fill="#717171" font-size="11">$60 USD por noche</text>
    <text x="200" y="108" text-anchor="end" fill="#222222" font-size="12">★ 4.88</text>
  </g>

  <g transform="translate(540, 120)">
    <!-- Tarjeta 3 -->
    <rect width="220" height="130" rx="10" fill="#f1f5f9"/>
    <rect width="220" height="90" rx="10" fill="#cbd5e1"/>
    <text x="110" y="50" text-anchor="middle" fill="#64748b" font-size="12">Foto Casa 3</text>
    <text x="10" y="108" fill="#222222" font-size="13" font-weight="bold">Santa Marta, Colombia</text>
    <text x="10" y="124" fill="#717171" font-size="11">$75 USD por noche</text>
    <text x="200" y="108" text-anchor="end" fill="#222222" font-size="12">★ 4.92</text>
  </g>
</svg>
