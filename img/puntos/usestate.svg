<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <text x="400" y="38" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold">¿Cómo funciona el Hook useState?</text>

  <!-- Declaración -->
  <g transform="translate(100, 65)">
    <rect width="600" height="50" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="30" y="32" fill="#93c5fd" font-family="monospace" font-size="16">const [</text>
    <text x="110" y="32" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">contador</text>
    <text x="195" y="32" fill="#93c5fd" font-family="monospace" font-size="16">, </text>
    <text x="215" y="32" fill="#a855f7" font-family="monospace" font-size="16" font-weight="bold">setContador</text>
    <text x="330" y="32" fill="#93c5fd" font-family="monospace" font-size="16">] = useState(</text>
    <text x="455" y="32" fill="#facc15" font-family="monospace" font-size="16" font-weight="bold">0</text>
    <text x="470" y="32" fill="#93c5fd" font-family="monospace" font-size="16">);</text>
  </g>

  <!-- Flechas explicativas -->
  <!-- 1. Valor actual -->
  <g transform="translate(145, 125)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="-5,35 0,43 5,35" fill="#38bdf8"/>
    <rect x="-65" y="47" width="130" height="60" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="0" y="70" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">Valor actual</text>
    <text x="0" y="90" text-anchor="middle" fill="#94a3b8" font-size="11">Dato guardado</text>
  </g>

  <!-- 2. Función actualizadora -->
  <g transform="translate(265, 125)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#a855f7" stroke-width="2"/>
    <polygon points="-5,35 0,43 5,35" fill="#a855f7"/>
    <rect x="-70" y="47" width="140" height="60" rx="6" fill="#1e293b" stroke="#a855f7"/>
    <text x="0" y="70" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="bold">Función set</text>
    <text x="0" y="90" text-anchor="middle" fill="#94a3b8" font-size="11">Re-renderiza la UI</text>
  </g>

  <!-- 3. Valor inicial -->
  <g transform="translate(460, 125)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#facc15" stroke-width="2"/>
    <polygon points="-5,35 0,43 5,35" fill="#facc15"/>
    <rect x="-65" y="47" width="130" height="60" rx="6" fill="#1e293b" stroke="#facc15"/>
    <text x="0" y="70" text-anchor="middle" fill="#fde047" font-size="12" font-weight="bold">Valor inicial</text>
    <text x="0" y="90" text-anchor="middle" fill="#94a3b8" font-size="11">Primer estado</text>
  </g>
</svg>
